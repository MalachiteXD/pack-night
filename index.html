<title>Pack Night</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: wall display, landscape, two columns. Left: title, plan, Wi-Fi. Right: tap-to-check-in board.
   Everything is sized in --u (1% of screen width on a 16:9 screen) so it scales to any landscape display.
   Narrow or square screens stack into one column. Colors come from the tokens below and can be changed in settings. */
:root {
  --ink: #11151c;
  --glow: rgba(242, 185, 92, 0.12);
  --panel: #181e27;
  --panel-hi: #212a36;
  --line: #303b4a;
  --text: #eef1f6;
  --muted: #a2adbd;
  --amber: #f2b95c;
  --amber-text: #f2b95c;
  --amber-ink: #2a1c05;
  --sage: #7fcdb6;
  --sage-text: #7fcdb6;
  --sage-tint: rgba(127, 205, 182, 0.15);
  --sage-ink: #08231c;
  --ember: #ef8f6e;
  --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --u: min(1vw, 1.7778vh);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  font-size: calc(var(--u) * 2);
  line-height: 1.4;
  color: var(--text);
  background: radial-gradient(circle at 5% -5%, var(--glow), transparent calc(var(--u) * 50)) no-repeat, var(--ink);
  padding-block: calc(var(--u) * 2.2);
  padding-left: max(calc(var(--u) * 3), env(safe-area-inset-left, 0px));
  padding-right: max(calc(var(--u) * 3), env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: calc(var(--u) * 0.35) solid var(--amber); outline-offset: calc(var(--u) * 0.3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.stage {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: calc(var(--u) * 3.2);
  height: 100%;
  min-height: 0;
}

/* Left column */
.left { position: relative; display: grid; grid-template-rows: 1fr auto; gap: calc(var(--u) * 2.2); min-height: 0; }
.watermark { position: absolute; right: calc(var(--u) * -1); top: calc(var(--u) * -1); width: calc(var(--u) * 17); height: calc(var(--u) * 17); color: var(--amber); opacity: 0.07; transform: rotate(14deg); pointer-events: none; }
.hero { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u) * 1.3); min-height: 0; }
.eyebrow { display: flex; align-items: center; gap: calc(var(--u) * 0.9); margin: 0; font-size: calc(var(--u) * 1.7); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber-text); }
.eyebrow svg { flex: none; width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: calc(var(--u) * 7.4); line-height: 0.95; letter-spacing: -0.025em; overflow-wrap: anywhere; }
.tagline { margin: 0; max-width: calc(var(--u) * 40); font-size: calc(var(--u) * 2.5); line-height: 1.3; font-weight: 500; }
.menu { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 0.3) calc(var(--u) * 1.1); list-style: none; margin: 0; padding: 0; font-size: calc(var(--u) * 2); color: var(--muted); }
.menu li + li::before { content: "\00b7"; margin-right: calc(var(--u) * 1.1); color: var(--amber-text); font-weight: 700; }
.when { margin: calc(var(--u) * 0.4) 0 0; padding: calc(var(--u) * 0.8) calc(var(--u) * 2); border: calc(var(--u) * 0.2) solid var(--amber); border-radius: 999px; font-size: calc(var(--u) * 2.2); font-weight: 700; color: var(--amber-text); }

.wifi { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: calc(var(--u) * 2.4); padding: calc(var(--u) * 2.2); background: var(--panel); border: calc(var(--u) * 0.15) solid var(--line); border-radius: calc(var(--u) * 2); }
.wifi-text { display: grid; gap: calc(var(--u) * 1.4); min-width: 0; }
.kv { display: grid; gap: calc(var(--u) * 0.2); min-width: 0; }
.k { display: flex; align-items: center; flex-wrap: wrap; gap: calc(var(--u) * 1); font-size: calc(var(--u) * 1.5); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tag { padding: calc(var(--u) * 0.2) calc(var(--u) * 1); border-radius: 999px; background: var(--amber); color: var(--amber-ink); font-size: calc(var(--u) * 1.4); letter-spacing: 0.04em; text-transform: none; }
.v { font-family: var(--font-display); font-size: calc(var(--u) * 3.6); font-weight: 700; line-height: 1.05; overflow-wrap: anywhere; }
.v.mono { font-family: var(--font-mono); font-weight: 500; font-size: calc(var(--u) * 3.2); letter-spacing: 0.02em; }
.qr { width: calc(var(--u) * 13); aspect-ratio: 1; display: grid; place-items: center; padding: calc(var(--u) * 0.3); background: #fff; border-radius: calc(var(--u) * 1.2); }
.qr svg { display: block; width: 100%; height: 100%; }
.qr-missing { padding: calc(var(--u) * 1); text-align: center; font-size: calc(var(--u) * 1.6); color: #1a2029; }
.wifi.example .qr { opacity: 0.35; }

/* Right column */
.board { display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); min-height: 0; overflow: auto; padding: calc(var(--u) * 2.4); background: var(--panel); border: calc(var(--u) * 0.15) solid var(--line); border-radius: calc(var(--u) * 2); }
.board-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: calc(var(--u) * 1.5); }
.board h2 { margin: 0; font-family: var(--font-display); font-size: calc(var(--u) * 4); font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
.board-head p { margin: 0; color: var(--muted); font-size: calc(var(--u) * 1.8); }
#groups { display: grid; gap: calc(var(--u) * 1.6); }
.group { display: grid; gap: calc(var(--u) * 1); --basis: calc(var(--u) * 10.5); }
.group[data-n="1"], .group[data-n="2"] { --basis: calc(var(--u) * 14); }
.group[data-n="4"] { --basis: calc(var(--u) * 8.5); }
.group-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: calc(var(--u) * 1.2); }
.group-head h3 { margin: 0; font-size: calc(var(--u) * 1.7); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.note { color: var(--muted); font-size: calc(var(--u) * 1.7); }
.stat { margin-left: auto; color: var(--sage-text); font-size: calc(var(--u) * 1.8); font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1.2); }
.opt { position: relative; flex: 1 1 var(--basis); min-height: max(48px, calc(var(--u) * 6.2)); padding: calc(var(--u) * 0.8) calc(var(--u) * 1.1); font-size: calc(var(--u) * 2.05); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; background: var(--panel-hi); border: calc(var(--u) * 0.2) solid var(--line); border-radius: calc(var(--u) * 1.5); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease; }
.opt:active { transform: scale(0.97); }
.opt.has { border-color: var(--sage); background: var(--sage-tint); }
.opt.pulse { animation: pulse 0.45s ease-out; }
@keyframes pulse { from { box-shadow: 0 0 0 0 var(--sage-tint); } to { box-shadow: 0 0 0 calc(var(--u) * 1.4) transparent; } }
.count[hidden] { display: none !important; }
.count { position: absolute; top: calc(var(--u) * -0.9); right: calc(var(--u) * -0.6); display: grid; place-items: center; min-width: calc(var(--u) * 3); height: calc(var(--u) * 3); padding: 0 calc(var(--u) * 0.7); border-radius: 999px; background: var(--sage); color: var(--sage-ink); font-size: calc(var(--u) * 1.8); font-weight: 700; font-variant-numeric: tabular-nums; }
.board-foot { display: flex; align-items: center; flex-wrap: wrap; gap: calc(var(--u) * 1.2); margin-top: auto; }
.since { flex: 1 1 calc(var(--u) * 12); min-width: 0; margin: 0; color: var(--muted); font-size: calc(var(--u) * 1.6); }
.btn { min-height: max(44px, calc(var(--u) * 5)); padding: calc(var(--u) * 0.9) calc(var(--u) * 1.8); font-size: calc(var(--u) * 1.8); font-weight: 700; background: transparent; border: calc(var(--u) * 0.2) solid var(--line); border-radius: calc(var(--u) * 1.2); cursor: pointer; touch-action: manipulation; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.armed { border-color: var(--ember); color: var(--ember); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.btn.small { min-height: max(40px, calc(var(--u) * 4.4)); padding: calc(var(--u) * 0.5) calc(var(--u) * 1.2); font-size: calc(var(--u) * 1.6); }
.btn.icon { display: grid; place-items: center; width: max(44px, calc(var(--u) * 5)); padding: 0; color: var(--muted); }
.btn.icon svg { width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); }

/* Settings sheet */
.overlay[hidden] { display: none !important; }
.overlay { position: fixed; inset: 0; z-index: 20; display: flex; background: rgba(8, 11, 16, 0.78); padding-top: calc(var(--u) * 2 + env(safe-area-inset-top, 0px)); padding-bottom: calc(var(--u) * 2 + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { display: flex; flex-direction: column; width: min(100%, calc(var(--u) * 80)); max-height: 100%; margin: auto; background: var(--panel); border: calc(var(--u) * 0.15) solid var(--line); border-radius: calc(var(--u) * 2); overflow: hidden; }
.sheet-body { display: grid; gap: calc(var(--u) * 2); padding: calc(var(--u) * 3); overflow: auto; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: calc(var(--u) * 3.4); font-weight: 800; }
.set { display: grid; gap: calc(var(--u) * 1.3); padding-top: calc(var(--u) * 2); border-top: calc(var(--u) * 0.15) solid var(--line); }
.set h3 { margin: 0; font-size: calc(var(--u) * 1.7); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber-text); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(var(--u) * 22)), 1fr)); gap: calc(var(--u) * 1.2); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(var(--u) * 12)), 1fr)); gap: calc(var(--u) * 1.2); }
.field { display: grid; gap: calc(var(--u) * 0.6); min-width: 0; }
.field label { font-size: calc(var(--u) * 1.5); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, .orow input[type="text"] { width: 100%; min-height: max(44px, calc(var(--u) * 6)); padding: calc(var(--u) * 1.1) calc(var(--u) * 1.5); font: inherit; font-size: max(16px, calc(var(--u) * 2.1)); color: var(--text); background: var(--ink); border: calc(var(--u) * 0.2) solid var(--line); border-radius: calc(var(--u) * 1.2); }
.field textarea { resize: vertical; line-height: 1.3; }
.field input[type="color"] { padding: calc(var(--u) * 0.3); cursor: pointer; }
.hint { margin: 0; color: var(--muted); font-size: calc(var(--u) * 1.7); }
.editor { display: grid; gap: calc(var(--u) * 1.6); }
.gbox { display: grid; gap: calc(var(--u) * 1.2); padding: calc(var(--u) * 2); background: var(--ink); border: calc(var(--u) * 0.15) solid var(--line); border-radius: calc(var(--u) * 1.6); }
.gbox .field input { background: var(--panel); }
.gbox-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: calc(var(--u) * 1); font-size: calc(var(--u) * 1.9); }
.row-acts { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 0.8); }
.orow { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--u) * 0.8) calc(var(--u) * 1); }
.orow input[type="text"] { flex: 1 1 calc(var(--u) * 20); width: auto; background: var(--panel); }
.chk { display: flex; align-items: center; gap: calc(var(--u) * 0.6); color: var(--muted); font-size: calc(var(--u) * 1.6); font-weight: 700; }
.chk input { width: max(24px, calc(var(--u) * 2.8)); height: max(24px, calc(var(--u) * 2.8)); accent-color: var(--sage); }
.sheet-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: calc(var(--u) * 1.2); padding: calc(var(--u) * 1.8) calc(var(--u) * 3); background: var(--panel); border-top: calc(var(--u) * 0.15) solid var(--line); }
.sheet-actions .restore { margin-right: auto; }

@media (prefers-reduced-motion: reduce) {
  .opt { transition: none; }
  .opt.pulse { animation: none; }
}

/* Narrow or square screens: one column */
@media (max-aspect-ratio: 5/4), (max-width: 760px) {
  :root { --u: clamp(7.5px, 1.9vw, 10px); }
  html, body { height: auto; min-height: 100%; }
  .stage { grid-template-columns: minmax(0, 1fr); height: auto; gap: calc(var(--u) * 2.4); }
  .left { grid-template-rows: auto auto; }
  .board { overflow: visible; }
  .qr { width: calc(var(--u) * 24); }
  .group[data-n="4"] { --basis: calc(var(--u) * 17); }
  .sheet-body { padding: calc(var(--u) * 2.4); }
  .sheet-actions { padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4); }
}
@media (max-width: 560px) {
  .wifi { grid-template-columns: minmax(0, 1fr); }
  .qr { justify-self: center; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="paw" viewBox="0 0 24 24">
    <ellipse cx="12" cy="16.2" rx="5" ry="4"/>
    <ellipse cx="5" cy="11.2" rx="1.9" ry="2.5" transform="rotate(-18 5 11.2)"/>
    <ellipse cx="9.2" cy="6.6" rx="2" ry="2.8" transform="rotate(-6 9.2 6.6)"/>
    <ellipse cx="14.8" cy="6.6" rx="2" ry="2.8" transform="rotate(6 14.8 6.6)"/>
    <ellipse cx="19" cy="11.2" rx="1.9" ry="2.5" transform="rotate(18 19 11.2)"/>
  </symbol>
</svg>

<main class="stage">
  <div class="left">
    <svg class="watermark" fill="currentColor" aria-hidden="true"><use href="#paw"/></svg>
    <header class="hero">
      <p class="eyebrow" id="eyebrow"><svg fill="currentColor" aria-hidden="true"><use href="#paw"/></svg><span id="eyebrow-text"></span></p>
      <h1 id="title"></h1>
      <p class="tagline" id="tagline"></p>
      <ul class="menu" id="menu"></ul>
      <p class="when" id="when"></p>
    </header>

    <section class="wifi" id="wifi" aria-label="Wi-Fi">
      <div class="wifi-text">
        <div class="kv">
          <span class="k"><span id="wifi-label"></span><span class="tag" id="wifi-tag" hidden>Example. Tap the sliders icon to add yours.</span></span>
          <span class="v" id="ssid"></span>
        </div>
        <div class="kv" id="pass-row">
          <span class="k" id="pass-label"></span>
          <span class="v mono" id="pass"></span>
        </div>
      </div>
      <div class="qr" id="qr"></div>
    </section>
  </div>

  <section class="board" aria-labelledby="board-title">
    <div class="board-head">
      <h2 id="board-title"></h2>
      <p id="board-hint"></p>
    </div>
    <div id="groups"></div>
    <div class="board-foot">
      <p class="since" id="since"></p>
      <button class="btn" id="undo" type="button"></button>
      <button class="btn" id="reset" type="button"></button>
      <button class="btn icon" id="gear" type="button" aria-label="Edit this page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>
      </button>
    </div>
  </section>
</main>

<div class="sr" id="live" aria-live="polite"></div>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" autocomplete="off">
    <div class="sheet-body" id="sheet-body">
      <h2 id="sheet-title">Edit this page</h2>
      <p class="hint">Changes are saved on this screen only. Nothing is sent anywhere. Cancel throws away everything you changed here.</p>

      <section class="set" aria-labelledby="s-wifi">
        <h3 id="s-wifi">Wi-Fi</h3>
        <div class="grid2">
          <div class="field"><label for="f-ssid">Network name</label><input id="f-ssid" type="text" maxlength="64" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
          <div class="field"><label for="f-pass">Password</label><input id="f-pass" type="text" maxlength="128" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
        </div>
        <div class="field">
          <label for="f-sec">Security</label>
          <select id="f-sec">
            <option value="WPA">WPA, WPA2 or WPA3</option>
            <option value="nopass">Open network, no password</option>
          </select>
        </div>
        <div class="grid2">
          <div class="field"><label for="f-wifilabel">Network heading</label><input id="f-wifilabel" type="text" maxlength="40"></div>
          <div class="field"><label for="f-passlabel">Password heading</label><input id="f-passlabel" type="text" maxlength="40"></div>
        </div>
      </section>

      <section class="set" aria-labelledby="s-text">
        <h3 id="s-text">Page text</h3>
        <div class="field"><label for="f-eyebrow">Small heading above the title</label><input id="f-eyebrow" type="text" maxlength="60"></div>
        <div class="field"><label for="f-title">Title</label><input id="f-title" type="text" maxlength="40"></div>
        <div class="field"><label for="f-tagline">Tagline</label><textarea id="f-tagline" rows="2" maxlength="200"></textarea></div>
        <div class="field"><label for="f-menu">Activities, one per line</label><textarea id="f-menu" rows="5"></textarea></div>
        <div class="field"><label for="f-when">Day and time</label><input id="f-when" type="text" maxlength="100" placeholder="Every Friday, 6 pm to late"></div>

      <section class="set" aria-labelledby="s-board">
        <h3 id="s-board">Check-in board</h3>
        <div class="grid2">
          <div class="field"><label for="f-boardtitle">Board title</label><input id="f-boardtitle" type="text" maxlength="40"></div>
          <div class="field"><label for="f-boardhint">Line beside the title</label><input id="f-boardhint" type="text" maxlength="80"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="f-undo">Undo button</label><input id="f-undo" type="text" maxlength="30"></div>
          <div class="field"><label for="f-reset">Reset button</label><input id="f-reset" type="text" maxlength="30"></div>
        </div>
        <div class="editor" id="editor"></div>
        <button class="btn" id="add-group" type="button">Add a question</button>
      </section>

      <section class="set" aria-labelledby="s-colors">
        <h3 id="s-colors">Colors</h3>
        <div class="grid3">
          <div class="field"><label for="f-c-bg">Background</label><input id="f-c-bg" type="color"></div>
          <div class="field"><label for="f-c-accent">Accent</label><input id="f-c-accent" type="color"></div>
          <div class="field"><label for="f-c-hi">Highlight</label><input id="f-c-hi" type="color"></div>
        </div>
        <div><button class="btn small" id="reset-colors" type="button">Original colors</button></div>
      </section>
    </div>
    <div class="sheet-actions">
      <button class="btn small restore" id="restore" type="button">Restore original page</button>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn primary" id="save" type="submit">Save</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function () {
  'use strict';

  var KEY = 'pack-night-v2';
  var MAX_GROUPS = 8, MAX_OPTS = 8, MAX_MENU = 12;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function uid() { return 'x' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }

  /* ---------- Content model ---------- */
  function defaultCfg() {
    return {
      eyebrow: 'Weekly open door',
      title: 'Pack Night',
      tagline: 'Our door is open to the whole pack. Come when you can, no pressure.',
      menu: ['Movies', 'Music', 'Games', 'Hot tub', 'Snacks'],
      when: 'Every week · day and time coming soon',
      wifiLabel: 'Wi-Fi network',
      passLabel: 'Password',
      boardTitle: 'Check in',
      boardHint: 'One tap per person',
      undoLabel: 'Undo last tap',
      resetLabel: 'Reset for next week',
      colors: { bg: '#11151c', accent: '#f2b95c', hi: '#7fcdb6' },
      groups: [
        { id: 'g-dinner', label: 'Dinner?', note: '', totalLabel: 'eating', opts: [
          { id: 'yes', label: "I'm eating", total: true },
          { id: 'no', label: 'Not tonight', total: false },
          { id: 'bring', label: "I'm bringing something", total: true }
        ] },
        { id: 'g-stay', label: 'How long?', note: '', totalLabel: '', opts: [
          { id: 'pop', label: 'Stopping by', total: false },
          { id: 'stay', label: 'Staying a while', total: false }
        ] },
        { id: 'g-mood', label: 'In the mood for', note: '', totalLabel: '', opts: [
          { id: 'movie', label: 'Movie', total: false },
          { id: 'game', label: 'Game', total: false },
          { id: 'tub', label: 'Hot tub', total: false },
          { id: 'music', label: 'Music', total: false }
        ] }
      ]
    };
  }

  function str(v, fb, max) { return typeof v === 'string' ? v.slice(0, max) : fb; }
  function hexOr(v, fb) { return typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v) ? v.toLowerCase() : fb; }

  function cleanCfg(raw) {
    var d = defaultCfg();
    raw = raw && typeof raw === 'object' ? raw : {};
    var c = {
      eyebrow: str(raw.eyebrow, d.eyebrow, 60),
      title: str(raw.title, d.title, 40),
      tagline: str(raw.tagline, d.tagline, 200),
      when: str(raw.when, d.when, 100),
      wifiLabel: str(raw.wifiLabel, d.wifiLabel, 40),
      passLabel: str(raw.passLabel, d.passLabel, 40),
      boardTitle: str(raw.boardTitle, d.boardTitle, 40),
      boardHint: str(raw.boardHint, d.boardHint, 80),
      undoLabel: str(raw.undoLabel, d.undoLabel, 30).trim() || d.undoLabel,
      resetLabel: str(raw.resetLabel, d.resetLabel, 30).trim() || d.resetLabel
    };
    var rc = raw.colors && typeof raw.colors === 'object' ? raw.colors : {};
    c.colors = { bg: hexOr(rc.bg, d.colors.bg), accent: hexOr(rc.accent, d.colors.accent), hi: hexOr(rc.hi, d.colors.hi) };
    c.menu = Array.isArray(raw.menu)
      ? raw.menu.map(function (x) { return typeof x === 'string' ? x.trim().slice(0, 40) : ''; }).filter(Boolean).slice(0, MAX_MENU)
      : d.menu;

    var seen = {};
    function fresh(id) {
      if (typeof id !== 'string' || !/^[A-Za-z][A-Za-z0-9_-]{0,23}$/.test(id) || seen[id]) id = uid();
      while (seen[id]) id = uid();
      seen[id] = true;
      return id;
    }
    var src = Array.isArray(raw.groups) ? raw.groups : d.groups;
    c.groups = [];
    src.slice(0, MAX_GROUPS).forEach(function (g) {
      if (!g || typeof g !== 'object') return;
      var opts = [];
      (Array.isArray(g.opts) ? g.opts : []).slice(0, MAX_OPTS).forEach(function (o) {
        if (!o || typeof o !== 'object') return;
        var label = str(o.label, '', 40).trim();
        if (!label) return;
        opts.push({ id: fresh(o.id), label: label, total: o.total === true });
      });
      if (!opts.length) return;
      c.groups.push({
        id: fresh(g.id),
        label: str(g.label, '', 60).trim(),
        note: str(g.note, '', 80).trim(),
        totalLabel: str(g.totalLabel, '', 24).trim(),
        opts: opts
      });
    });
    return c;
  }

  function cleanWifi(w) {
    w = w && typeof w === 'object' ? w : {};
    return { ssid: str(w.ssid, '', 64).trim(), pass: str(w.pass, '', 128), sec: w.sec === 'nopass' ? 'nopass' : 'WPA' };
  }

  function optIds(cfg) {
    var m = {};
    cfg.groups.forEach(function (g) { g.opts.forEach(function (o) { m[o.id] = o.label; }); });
    return m;
  }

  /* ---------- State and storage ---------- */
  var state = { cfg: defaultCfg(), wifi: cleanWifi(null), tally: {}, undo: [], since: null };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var p = JSON.parse(raw);
      state.cfg = cleanCfg(p.cfg);
      state.wifi = cleanWifi(p.wifi);
      var ids = optIds(state.cfg);
      if (p.tally && typeof p.tally === 'object') {
        Object.keys(ids).forEach(function (id) {
          var n = p.tally[id];
          if (typeof n === 'number' && isFinite(n) && n > 0) state.tally[id] = Math.floor(n);
        });
      }
      if (Array.isArray(p.undo)) {
        state.undo = p.undo.filter(function (id) { return typeof id === 'string' && ids[id]; }).slice(-60);
      }
      if (typeof p.since === 'number') state.since = p.since;
    } catch (e) { /* storage unavailable or damaged: start from the defaults */ }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  function count(id) { return state.tally[id] || 0; }
  function total() {
    var t = 0;
    Object.keys(optIds(state.cfg)).forEach(function (id) { t += count(id); });
    return t;
  }

  /* ---------- Colors ---------- */
  var THEME_KEYS = ['--ink', '--panel', '--panel-hi', '--line', '--text', '--muted', '--amber', '--amber-text', '--amber-ink', '--sage', '--sage-text', '--sage-ink', '--sage-tint', '--glow'];

  function hex2rgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgb2hex(a) {
    return '#' + a.map(function (v) {
      v = Math.max(0, Math.min(255, Math.round(v)));
      return (v < 16 ? '0' : '') + v.toString(16);
    }).join('');
  }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function lum(a) {
    function f(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    return 0.2126 * f(a[0]) + 0.7152 * f(a[1]) + 0.0722 * f(a[2]);
  }
  function onColor(rgb) { return lum(rgb) > 0.4 ? '#1b1405' : '#ffffff'; }

  function applyTheme(c) {
    var d = defaultCfg().colors;
    var root = document.documentElement.style;
    if (c.bg === d.bg && c.accent === d.accent && c.hi === d.hi) {
      THEME_KEYS.forEach(function (k) { root.removeProperty(k); });
      root.removeProperty('color-scheme');
      return;
    }
    var bg = hex2rgb(c.bg), ac = hex2rgb(c.accent), hi = hex2rgb(c.hi);
    var light = lum(bg) > 0.5, W = [255, 255, 255], B = [0, 0, 0];
    function set(k, v) { root.setProperty(k, v); }
    set('--ink', c.bg);
    set('--panel', rgb2hex(light ? mix(bg, W, 0.55) : mix(bg, W, 0.04)));
    set('--panel-hi', rgb2hex(light ? mix(bg, B, 0.05) : mix(bg, W, 0.09)));
    set('--line', rgb2hex(light ? mix(bg, B, 0.16) : mix(bg, W, 0.16)));
    set('--text', light ? '#12161d' : '#eef1f6');
    set('--muted', light ? '#4d596a' : '#a2adbd');
    set('--amber', c.accent);
    set('--amber-text', rgb2hex(light ? mix(ac, B, 0.4) : ac));
    set('--amber-ink', onColor(ac));
    set('--sage', c.hi);
    set('--sage-text', rgb2hex(light ? mix(hi, B, 0.4) : hi));
    set('--sage-ink', onColor(hi));
    set('--sage-tint', 'rgba(' + hi.join(',') + ',0.15)');
    set('--glow', 'rgba(' + ac.join(',') + ',' + (light ? 0.18 : 0.12) + ')');
    root.setProperty('color-scheme', light ? 'light' : 'dark');
  }

  /* ---------- Wi-Fi and QR ---------- */
  function esc(s) { return String(s).replace(/([\\;,:"])/g, '\\$1'); }

  function wifiString(ssid, pass, open) {
    if (open) return 'WIFI:T:nopass;S:' + esc(ssid) + ';;';
    return 'WIFI:T:WPA;S:' + esc(ssid) + ';P:' + esc(pass) + ';;';
  }

  function qrSvg(text) {
    if (typeof qrcode !== 'function') return '';
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    var n = qr.getModuleCount(), m = 2, d = '', r, c;
    for (r = 0; r < n; r++) {
      for (c = 0; c < n; c++) {
        if (qr.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
      }
    }
    var size = n + m * 2;
    return '<svg viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="QR code to join the Wi-Fi" shape-rendering="crispEdges">' +
      '<rect width="' + size + '" height="' + size + '" fill="#ffffff"/>' +
      '<path d="' + d + '" fill="#0e1218"/></svg>';
  }

  function renderWifi() {
    var w = state.wifi;
    var configured = !!w.ssid;
    var ssid = configured ? w.ssid : 'Your Wi-Fi name';
    var pass = configured ? w.pass : 'your-password';
    var open = w.sec === 'nopass' || (configured && !pass);
    $('ssid').textContent = ssid;
    $('pass').textContent = pass;
    $('pass-row').hidden = open;
    $('wifi').classList.toggle('example', !configured);
    $('wifi-tag').hidden = configured;
    var out = '';
    try { out = qrSvg(wifiString(ssid, pass, open)); } catch (e) { out = ''; }
    $('qr').innerHTML = out || '<span class="qr-missing">QR code unavailable</span>';
  }

  /* ---------- Page text ---------- */
  var armed = false, armTimer = null;

  function setText(id, text) {
    var e = $(id);
    e.textContent = text;
    e.hidden = !text;
  }

  function renderText() {
    var c = state.cfg;
    $('eyebrow-text').textContent = c.eyebrow;
    $('eyebrow').hidden = !c.eyebrow;
    setText('title', c.title);
    setText('tagline', c.tagline);
    setText('when', c.when);
    var menu = $('menu');
    menu.textContent = '';
    c.menu.forEach(function (m) { menu.appendChild(el('li', null, m)); });
    menu.hidden = !c.menu.length;
    $('wifi-label').textContent = c.wifiLabel;
    $('pass-label').textContent = c.passLabel;
    setText('board-title', c.boardTitle);
    setText('board-hint', c.boardHint);
    $('undo').textContent = c.undoLabel;
    if (!armed) $('reset').textContent = c.resetLabel;
  }

  /* ---------- Board ---------- */
  var refs = {}, statEls = {};

  function buildBoard() {
    var host = $('groups');
    host.textContent = '';
    refs = {};
    statEls = {};
    state.cfg.groups.forEach(function (g) {
      var wrap = el('div', 'group');
      wrap.setAttribute('data-n', String(Math.min(g.opts.length, 4)));
      var head = el('div', 'group-head');
      if (g.label) head.appendChild(el('h3', null, g.label));
      if (g.note) head.appendChild(el('span', 'note', g.note));
      if (g.totalLabel) {
        var st = el('span', 'stat');
        head.appendChild(st);
        statEls[g.id] = st;
      }
      if (head.childNodes.length) wrap.appendChild(head);

      var row = el('div', 'opts');
      g.opts.forEach(function (o) {
        var b = el('button', 'opt');
        b.type = 'button';
        b.appendChild(el('span', null, o.label));
        var c = el('span', 'count');
        c.hidden = true;
        c.setAttribute('aria-hidden', 'true');
        b.appendChild(c);
        var holdTimer = null;
        var longPressed = false;
        function clearHold() {
          if (holdTimer !== null) {
            clearTimeout(holdTimer);
            holdTimer = null;
          }
        }
        b.addEventListener('pointerdown', function (event) {
          if (event.button !== undefined && event.button !== 0) return;
          longPressed = false;
          clearHold();
          holdTimer = setTimeout(function () {
            holdTimer = null;
            longPressed = true;
            removeTap(o.id);
          }, 550);
        });
        b.addEventListener('pointerup', clearHold);
        b.addEventListener('pointerleave', clearHold);
        b.addEventListener('pointercancel', function () {
          clearHold();
          longPressed = false;
        });
        b.addEventListener('contextmenu', function (event) { event.preventDefault(); });
        b.addEventListener('click', function () {
          if (longPressed) {
            longPressed = false;
            return;
          }
          tap(o.id);
        });
        row.appendChild(b);
        refs[o.id] = { btn: b, count: c, label: o.label };
      });
      wrap.appendChild(row);
      host.appendChild(wrap);
    });
  }

  function sinceText() {
    if (!state.since) return 'No taps yet this week';
    try {
      return 'Counting since ' + new Date(state.since).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    } catch (e) { return 'Counting taps'; }
  }

  function renderCounts() {
    state.cfg.groups.forEach(function (g) {
      var sum = 0;
      g.opts.forEach(function (o) {
        var ref = refs[o.id], n = count(o.id);
        ref.count.textContent = n;
        ref.count.hidden = n === 0;
        ref.btn.classList.toggle('has', n > 0);
        ref.btn.setAttribute('aria-label', o.label + (n ? ', ' + n + ' so far' : ''));
        if (o.total) sum += n;
      });
      if (statEls[g.id]) statEls[g.id].textContent = sum ? sum + ' ' + g.totalLabel : '';
    });
    $('since').textContent = sinceText();
    $('undo').disabled = state.undo.length === 0;
  }

  function pulse(id) {
    var b = refs[id] && refs[id].btn;
    if (!b) return;
    b.classList.remove('pulse');
    void b.offsetWidth;
    b.classList.add('pulse');
    setTimeout(function () { b.classList.remove('pulse'); }, 500);
  }

  function announce(text) {
    var live = $('live');
    live.textContent = '';
    live.textContent = text;
  }

  function tap(id) {
    state.tally[id] = count(id) + 1;
    state.undo.push(id);
    if (state.undo.length > 60) state.undo.shift();
    if (!state.since) state.since = Date.now();
    save();
    renderCounts();
    pulse(id);
    announce(refs[id].label + ', ' + count(id));
  }

  function removeTap(id) {
    if (count(id) <= 0) return;
    state.tally[id] = count(id) - 1;
    if (!state.tally[id]) delete state.tally[id];

    // Keep the global Undo history consistent by removing the most recent
    // matching tap for this option.
    for (var i = state.undo.length - 1; i >= 0; i--) {
      if (state.undo[i] === id) {
        state.undo.splice(i, 1);
        break;
      }
    }

    if (total() === 0) state.since = null;
    save();
    renderCounts();
    announce(refs[id].label + ', ' + count(id) + ' remaining');
  }

  function undo() {
    var id = state.undo.pop();
    if (!id) return;
    state.tally[id] = Math.max(0, count(id) - 1);
    if (!state.tally[id]) delete state.tally[id];
    if (total() === 0) state.since = null;
    save();
    renderCounts();
    announce('Last tap undone');
  }

  function disarm() {
    armed = false;
    clearTimeout(armTimer);
    var r = $('reset');
    r.classList.remove('armed');
    r.textContent = state.cfg.resetLabel;
  }

  function reset() {
    if (!armed) {
      armed = true;
      var r = $('reset');
      r.classList.add('armed');
      r.textContent = 'Tap again to clear all';
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    state.tally = {};
    state.undo = [];
    state.since = null;
    save();
    renderCounts();
    announce('All counts cleared');
  }

  function renderAll() {
    applyTheme(state.cfg.colors);
    renderText();
    renderWifi();
    buildBoard();
    renderCounts();
  }

  $('undo').addEventListener('click', undo);
  $('reset').addEventListener('click', reset);

  /* ---------- Editing sheet ---------- */
  var overlay = $('overlay');
  var draft = null, dwifi = null;

  var BIND = [
    ['f-eyebrow', 'eyebrow'], ['f-title', 'title'], ['f-tagline', 'tagline'], ['f-when', 'when'],
    ['f-wifilabel', 'wifiLabel'], ['f-passlabel', 'passLabel'],
    ['f-boardtitle', 'boardTitle'], ['f-boardhint', 'boardHint'], ['f-undo', 'undoLabel'], ['f-reset', 'resetLabel']
  ];

  BIND.forEach(function (b) {
    $(b[0]).addEventListener('input', function () { if (draft) draft[b[1]] = $(b[0]).value; });
  });
  $('f-menu').addEventListener('input', function () { if (draft) draft.menu = $('f-menu').value.split('\n'); });
  $('f-ssid').addEventListener('input', function () { if (dwifi) dwifi.ssid = $('f-ssid').value; });
  $('f-pass').addEventListener('input', function () { if (dwifi) dwifi.pass = $('f-pass').value; });
  $('f-sec').addEventListener('change', function () { if (dwifi) dwifi.sec = $('f-sec').value; });
  [['f-c-bg', 'bg'], ['f-c-accent', 'accent'], ['f-c-hi', 'hi']].forEach(function (c) {
    $(c[0]).addEventListener('input', function () {
      if (!draft) return;
      draft.colors[c[1]] = $(c[0]).value;
      applyTheme(draft.colors);
    });
  });

  function moveItem(arr, i, dir) {
    var j = i + dir;
    if (j < 0 || j >= arr.length) return;
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }

  function smallBtn(text, disabled, fn, label) {
    var b = el('button', 'btn small', text);
    b.type = 'button';
    b.disabled = !!disabled;
    if (label) b.setAttribute('aria-label', label);
    b.addEventListener('click', fn);
    return b;
  }

  function textField(id, label, value, max, placeholder, onInput) {
    var f = el('div', 'field');
    var l = el('label', null, label);
    l.setAttribute('for', id);
    var i = document.createElement('input');
    i.type = 'text';
    i.id = id;
    i.value = value;
    i.maxLength = max;
    if (placeholder) i.placeholder = placeholder;
    i.addEventListener('input', function () { onInput(i.value); });
    f.appendChild(l);
    f.appendChild(i);
    return f;
  }

  function rebuildEditor(focusId) {
    var body = $('sheet-body'), top = body.scrollTop;
    buildEditor();
    body.scrollTop = top;
    if (focusId && $(focusId)) $(focusId).focus();
  }

  function buildEditor() {
    var host = $('editor');
    host.textContent = '';
    draft.groups.forEach(function (g, gi) {
      var q = 'question ' + (gi + 1);
      var box = el('div', 'gbox');
      var top = el('div', 'gbox-top');
      top.appendChild(el('strong', null, 'Question ' + (gi + 1)));
      var acts = el('div', 'row-acts');
      acts.appendChild(smallBtn('Up', gi === 0, function () { moveItem(draft.groups, gi, -1); rebuildEditor(); }, 'Move ' + q + ' up'));
      acts.appendChild(smallBtn('Down', gi === draft.groups.length - 1, function () { moveItem(draft.groups, gi, 1); rebuildEditor(); }, 'Move ' + q + ' down'));
      acts.appendChild(smallBtn('Remove', false, function () { draft.groups.splice(gi, 1); rebuildEditor(); }, 'Remove ' + q));
      top.appendChild(acts);
      box.appendChild(top);
      box.appendChild(textField('e-' + g.id + '-label', 'Question', g.label, 60, 'Dinner?', function (v) { g.label = v; }));
      box.appendChild(textField('e-' + g.id + '-note', 'Note beside it (optional)', g.note, 80, 'Dinner around 7', function (v) { g.note = v; }));
      box.appendChild(textField('e-' + g.id + '-total', 'Running total label (optional)', g.totalLabel, 24, 'eating', function (v) { g.totalLabel = v; }));
      box.appendChild(el('p', 'hint', 'Answers marked Counts add up to the running total.'));

      g.opts.forEach(function (o, oi) {
        var a = 'answer ' + (oi + 1) + ' of ' + q;
        var row = el('div', 'orow');
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.id = 'e-' + o.id + '-label';
        inp.value = o.label;
        inp.maxLength = 40;
        inp.placeholder = 'Answer';
        inp.setAttribute('aria-label', 'Text of ' + a);
        inp.addEventListener('input', function () { o.label = inp.value; });
        row.appendChild(inp);

        var chk = el('label', 'chk');
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = 'e-' + o.id + '-counts';
        cb.checked = !!o.total;
        cb.addEventListener('change', function () { o.total = cb.checked; });
        chk.appendChild(cb);
        chk.appendChild(document.createTextNode('Counts'));
        row.appendChild(chk);

        row.appendChild(smallBtn('Up', oi === 0, function () { moveItem(g.opts, oi, -1); rebuildEditor(); }, 'Move ' + a + ' up'));
        row.appendChild(smallBtn('Down', oi === g.opts.length - 1, function () { moveItem(g.opts, oi, 1); rebuildEditor(); }, 'Move ' + a + ' down'));
        row.appendChild(smallBtn('Remove', false, function () { g.opts.splice(oi, 1); rebuildEditor(); }, 'Remove ' + a));
        box.appendChild(row);
      });

      if (g.opts.length < MAX_OPTS) {
        box.appendChild(smallBtn('Add an answer', false, function () {
          var o = { id: uid(), label: '', total: false };
          g.opts.push(o);
          rebuildEditor('e-' + o.id + '-label');
        }));
      }
      host.appendChild(box);
    });
    $('add-group').disabled = draft.groups.length >= MAX_GROUPS;
  }

  $('add-group').addEventListener('click', function () {
    if (!draft || draft.groups.length >= MAX_GROUPS) return;
    var g = { id: uid(), label: '', note: '', totalLabel: '', opts: [
      { id: uid(), label: '', total: false }, { id: uid(), label: '', total: false }
    ] };
    draft.groups.push(g);
    rebuildEditor('e-' + g.id + '-label');
  });

  function fillForm() {
    $('f-ssid').value = dwifi.ssid;
    $('f-pass').value = dwifi.pass;
    $('f-sec').value = dwifi.sec;
    BIND.forEach(function (b) { $(b[0]).value = draft[b[1]]; });
    $('f-menu').value = draft.menu.join('\n');
    $('f-c-bg').value = draft.colors.bg;
    $('f-c-accent').value = draft.colors.accent;
    $('f-c-hi').value = draft.colors.hi;
    buildEditor();
  }

  function openSheet() {
    draft = JSON.parse(JSON.stringify(state.cfg));
    dwifi = JSON.parse(JSON.stringify(state.wifi));
    fillForm();
    overlay.hidden = false;
    $('sheet-body').scrollTop = 0;
    $('f-ssid').focus();
  }

  function closeSheet(saved) {
    overlay.hidden = true;
    draft = null;
    dwifi = null;
    if (!saved) applyTheme(state.cfg.colors);
    $('gear').focus();
  }

  $('restore').addEventListener('click', function () {
    if (!draft) return;
    draft = defaultCfg();
    fillForm();
    applyTheme(draft.colors);
  });

  $('reset-colors').addEventListener('click', function () {
    if (!draft) return;
    draft.colors = defaultCfg().colors;
    $('f-c-bg').value = draft.colors.bg;
    $('f-c-accent').value = draft.colors.accent;
    $('f-c-hi').value = draft.colors.hi;
    applyTheme(draft.colors);
  });

  $('gear').addEventListener('click', openSheet);
  $('cancel').addEventListener('click', function () { closeSheet(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlay.hidden) closeSheet(false);
  });

  $('sheet').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!draft) return;
    state.cfg = cleanCfg(draft);
    state.wifi = cleanWifi(dwifi);
    var ids = optIds(state.cfg), kept = {};
    Object.keys(ids).forEach(function (id) { if (state.tally[id]) kept[id] = state.tally[id]; });
    state.tally = kept;
    state.undo = state.undo.filter(function (id) { return ids[id]; });
    if (total() === 0) state.since = null;
    save();
    disarm();
    renderAll();
    closeSheet(true);
  });

  load();
  renderAll();
})();
</script>
